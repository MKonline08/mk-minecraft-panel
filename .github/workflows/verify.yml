name: Verify and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results/
            docs/screenshots/
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        type: [VANILLA, PAPER, FABRIC, SPIGOT, PURPUR, FORGE, NEOFORGE, QUILT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
        env:
          SERVER_TYPE: ${{ matrix.type }}
  modpacks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:modpacks
        env:
          PACK_LOADER: ${{ matrix.loader }}
  package:
    needs: [checks, minecraft, modpacks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mk-panel:test
          platforms: linux/amd64
      - name: Validate packaged application
        run: |
          docker compose config -q
          mkdir -p /tmp/mk-package-data
          docker run -d --name mk-package -p 8088:8080 -e HOST_DATA_DIR=/tmp/mk-package-data -v /tmp/mk-package-data:/data -v /var/run/docker.sock:/var/run/docker.sock mk-panel:test
          for i in $(seq 1 30); do curl -fsS http://localhost:8088/api/health && break || sleep 2; done
          curl -fsS http://localhost:8088/api/health
          curl -fsS http://localhost:8088/ | grep 'MK Minecraft Panel'
          node scripts/package-smoke.mjs
      - name: Verify upgrade from populated v1.2.1 installation
        run: |
          mkdir -p /tmp/mk-upgrade-data
          docker run -d --name mk-upgrade -p 8089:8080 -e HOST_DATA_DIR=/tmp/mk-upgrade-data -v /tmp/mk-upgrade-data:/data -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/mkonline08/mk-minecraft-panel:1.2.1
          for i in $(seq 1 30); do curl -fsS http://localhost:8089/api/health && break || sleep 2; done
          node scripts/upgrade-smoke.mjs seed
          docker stop mk-upgrade
          docker rm mk-upgrade
          docker run -d --name mk-upgrade -p 8089:8080 -e HOST_DATA_DIR=/tmp/mk-upgrade-data -v /tmp/mk-upgrade-data:/data -v /var/run/docker.sock:/var/run/docker.sock mk-panel:test
          for i in $(seq 1 30); do curl -fsS http://localhost:8089/api/health && break || sleep 2; done
          node scripts/upgrade-smoke.mjs verify
      - name: Verify upgrade from populated v1.3.0 installation
        run: |
          docker rm -f mk-upgrade
          mkdir -p /tmp/mk-upgrade-data-130
          docker run -d --name mk-upgrade -p 8089:8080 -e HOST_DATA_DIR=/tmp/mk-upgrade-data-130 -v /tmp/mk-upgrade-data-130:/data -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/mkonline08/mk-minecraft-panel:1.3.0
          for i in $(seq 1 30); do curl -fsS http://localhost:8089/api/health && break || sleep 2; done
          node scripts/upgrade-smoke.mjs seed
          docker stop mk-upgrade
          docker rm mk-upgrade
          docker run -d --name mk-upgrade -p 8089:8080 -e HOST_DATA_DIR=/tmp/mk-upgrade-data-130 -v /tmp/mk-upgrade-data-130:/data -v /var/run/docker.sock:/var/run/docker.sock mk-panel:test
          for i in $(seq 1 30); do curl -fsS http://localhost:8089/api/health && break || sleep 2; done
          node scripts/upgrade-smoke.mjs verify
      - name: Determine unpublished release version
        id: release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag and package version must match" >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish versioned image
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          docker tag mk-panel:test ghcr.io/mkonline08/mk-minecraft-panel:$VERSION
          docker push ghcr.io/mkonline08/mk-minecraft-panel:$VERSION
      - name: Publish release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ -f "docs/v$VERSION.md" ]]; then
            gh release create "v$VERSION" docker-compose.yml --target "$GITHUB_SHA" --title "MK Minecraft Panel v$VERSION" --notes-file "docs/v$VERSION.md"
          else
            gh release create "v$VERSION" docker-compose.yml --target "$GITHUB_SHA" --title "MK Minecraft Panel v$VERSION" --generate-notes
          fi
